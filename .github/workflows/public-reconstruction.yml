name: Public reconstruction
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/reconstruct_public_release.py'
      - 'scripts/verify_public_release.py'
      - 'src/najd_datasets/adapters.py'
      - 'releases/2026.09.14/public-*.json'
      - '.github/workflows/public-reconstruction.yml'
permissions:
  contents: read
jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra dev --extra parquet --extra excel
      - run: uv run pytest
      - run: uv run python scripts/reconstruct_public_release.py --output build/public-release
      - run: uv run python scripts/verify_public_release.py build/public-release
      - uses: actions/upload-artifact@v4
        with:
          name: public-reconstruction-evidence
          path: |
            build/public-release/evidence.json
            build/public-release/verification.json
