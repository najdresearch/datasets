name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra dev
      - run: uv run pytest
      - run: uv run ruff check src/najd_datasets/audit.py tests/test_audit.py
      - run: uv run najd-datasets audit-public-inputs releases/2026.09.14/sources.json --sources sources
