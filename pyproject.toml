[project]
name = "najd-datasets"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["huggingface-hub>=0.36,<2"]

[project.optional-dependencies]
dev = [
    "jsonschema>=4.23,<5",
    "pytest>=8,<9",
    "ruff>=0.13,<1",
]
parquet = ["pyarrow>=20,<25"]
excel = ["pandas>=2.2,<3", "openpyxl>=3.1,<4"]

[project.scripts]
najd-datasets = "najd_datasets.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/najd_datasets"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
